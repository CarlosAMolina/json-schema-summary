repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: make ruff-fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: make ruff-format
        language: system
        types: [python]

      - id: mypy
        name: Mypy
        entry: make mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: test
        name: test
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
